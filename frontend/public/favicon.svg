<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Solid Duolingo Green Head (No gradients to avoid Chrome tab bar black fallback bug) -->
  <rect x="0" y="0" width="48" height="48" rx="24" fill="#58CC02" />

  <!-- Left Ear Feather Tuft -->
  <path d="M4 14 C1 4 15 4 18 10 Z" fill="#78E020" />

  <!-- Right Ear Feather Tuft -->
  <path d="M44 14 C47 4 33 4 30 10 Z" fill="#78E020" />

  <!-- Big White Eyes -->
  <ellipse cx="16" cy="23" rx="9.5" ry="11.5" fill="#FFFFFF" />
  <ellipse cx="32" cy="23" rx="9.5" ry="11.5" fill="#FFFFFF" />

  <!-- Dark Pupils -->
  <ellipse cx="18" cy="23" rx="5" ry="6.5" fill="#4B4B4B" />
  <ellipse cx="30" cy="23" rx="5" ry="6.5" fill="#4B4B4B" />

  <!-- White Eye Sparkle Glints -->
  <circle cx="16.5" cy="20.5" r="2.2" fill="#FFFFFF" />
  <circle cx="28.5" cy="20.5" r="2.2" fill="#FFFFFF" />
  <circle cx="20" cy="26" r="1.1" fill="#FFFFFF" />
  <circle cx="32" cy="26" r="1.1" fill="#FFFFFF" />

  <!-- Bright Orange Beak -->
  <path d="M19 27 Q24 39 29 27 Z" fill="#FF9600" />
  <ellipse cx="24" cy="28" rx="4.5" ry="1.8" fill="#FFC800" />
</svg>
